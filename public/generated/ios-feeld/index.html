<!doctype html>
<!--
  GOLDEN PROMPT 产物 · Feeld · 规范：Feeld iOS
  决策溯源：见 designs/ios-feeld/DESIGN.md（colors / typography / rounded / spacing / components）
  ─ canvas #000000 · surface #121212 · text #FF5C8A · primary #E8FF63
  ─ 字体 Inter · card 16px / control 8px
  ─ 领域：约会；共享手机外壳与交互，领域页面按规范气质重建
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Feeld · Feeld iOS</title>
<style>
:root{
--bg:#000000;--surface:#121212;--surface2:#1C1C1E;--text:#FF5C8A;--muted:#A8A8A8;--border:#2A2A2A;
--primary:#E8FF63;--primary-text:#E8FF63;--on-primary:#000000;--accent:#D4EB4F;--ok:#66E0A3;--warn:#E8FF63;--danger:#FF6B6B;
--r-card:16px;--r-ctl:8px;--r-pill:9999px;
--font:Inter, ui-sans-serif, system-ui, sans-serif, 'PingFang SC', 'Microsoft YaHei', sans-serif;
--shadow:0 12px 32px rgba(0,0,0,.45);
}

*{box-sizing:border-box;margin:0;transition:background-color .18s ease,color .18s ease,border-color .18s ease}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
input:focus-visible{outline:2px solid var(--primary);outline-offset:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html,body{height:100%}
body{background:#0a0a0a;color:var(--text);font:400 15px/1.45 var(--font);display:grid;place-items:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit;border:0;outline:0;background:none}
::-webkit-scrollbar{width:0;height:0}
.app{position:relative;width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text)}
.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.statusbar{display:flex;align-items:center;justify-content:space-between;height:42px;padding:2px 22px 0;font:600 13px/1 var(--font);flex:none}
.statusbar svg{display:block}
.appbar{display:flex;align-items:center;gap:10px;padding:4px 16px 8px;flex:none}
.appbar div{flex:1;min-width:0}
.appbar h1{font:700 26px/1.15 var(--font);letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .sub{display:block;font:400 11px/1.4 var(--font);color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:var(--text);flex:none}
.iconbtn::before{content:"";position:absolute;inset:-4px}
.iconbtn:active{background:var(--surface2)}
.avatar{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary-text);font:700 11px/1 var(--font);flex:none}
.content{position:relative;flex:1;min-height:0;overflow:hidden}
.view{display:none;height:100%;overflow-y:auto;padding-bottom:86px}
.view.on{display:block;animation:vin .18s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tabbar{position:relative;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-flow:column;height:70px;padding:6px 8px 18px;border-top:1px solid var(--border);background:var(--bg);flex:none}
.tab{display:grid;justify-items:center;gap:3px;padding:3px 0;color:var(--muted);font:600 10px/1 var(--font)}
.tab .icon{width:23px;height:23px;stroke-width:1.7}
.tab.on{color:var(--primary-text)}
.tab.on .icon{stroke-width:2.2}
.homebar{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:99px;background:var(--text);opacity:.5}
.section{padding:16px 16px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.section-head b{font:700 19px/1.25 var(--font);letter-spacing:-.2px}
.section-head span{font:600 11px/1 var(--font);color:var(--muted)}
.hero{position:relative;margin:0 16px;padding:18px;border-radius:var(--r-card);overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));min-height:170px;display:flex;align-items:flex-end;color:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.48))}
.hero-art{position:relative;z-index:1;width:84px;height:84px;border-radius:var(--r-ctl);background:rgba(255,255,255,.2);display:grid;place-items:center;font:800 24px/1 var(--font);flex:none;margin-right:14px;backdrop-filter:blur(6px)}
.hero-copy{position:relative;z-index:1;flex:1;min-width:0}
.hero-copy small{font:700 10px/1 var(--font);letter-spacing:1px;opacity:.85;text-transform:uppercase}
.hero-copy b{display:block;font:700 22px/1.15 var(--font);letter-spacing:-.3px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-copy p{font:400 12px/1.4 var(--font);opacity:.85;margin-top:3px}
.hero-btn{position:absolute;right:16px;bottom:16px;z-index:2;min-height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--primary);color:var(--on-primary);font:700 12px/1 var(--font)}
.stats{display:grid;gap:8px;margin:12px 16px 0;padding:12px;border-radius:var(--r-card);background:var(--surface)}
.stats.cols3{grid-template-columns:repeat(3,1fr)}
.stats small{display:block;font:600 10px/1 var(--font);letter-spacing:.4px;color:var(--muted)}
.stats b{display:block;font:800 19px/1.2 var(--font);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 4px}
.tile{flex:none;width:128px;text-align:left}
.art{position:relative;width:100%;aspect-ratio:1;border-radius:var(--r-ctl);overflow:hidden;background:linear-gradient(145deg,var(--c1),var(--c2));display:grid;place-items:center;color:#fff;font:800 20px/1 var(--font)}
.art::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;right:-18%;top:-24%;background:rgba(255,255,255,.16)}
.art span{position:relative;z-index:1}
.tile b{display:block;font:600 14px/1.3 var(--font);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{display:block;font:400 12px/1.3 var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.posters{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:2px 16px 4px}
.poster{text-align:left}
.poster .art{aspect-ratio:2/3;font-size:15px}
.poster b{display:block;font:600 12px/1.3 var(--font);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster small{display:block;font:400 10px/1.3 var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:grid;padding:0 16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .art{width:44px;height:44px;aspect-ratio:auto;font-size:13px;flex:none}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font:600 15px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main span{display:block;font:400 12px/1.4 var(--font);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{font:600 11px/1.2 var(--font);color:var(--muted);font-variant-numeric:tabular-nums;flex:none;text-align:right}
.chips{display:flex;gap:7px;padding:2px 16px 14px;overflow-x:auto}
.chip{position:relative;flex:none;padding:6px 11px;border-radius:var(--r-pill);background:var(--surface);color:var(--text);font:600 11px/1 var(--font);white-space:nowrap}
.chip::after{content:"";position:absolute;inset:-11px 0}
.ptr{position:fixed;left:50%;top:72px;transform:translate(-50%,-10px);opacity:0;transition:opacity .15s ease,transform .15s ease;pointer-events:none;z-index:70;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow)}
.ptr.on{opacity:1;transform:translate(-50%,0)}
.ptr span{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--primary);display:block}
.segwrap{display:block}
.seg{display:flex;gap:2px;background:var(--surface2);border-radius:var(--r-ctl);padding:3px;margin:0 0 10px}
.seg-btn{position:relative;flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:7px 4px;border-radius:calc(var(--r-ctl) - 2px);min-height:34px;cursor:pointer}
.seg-btn::before{content:"";position:absolute;inset:-5px 0}
.seg-btn.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.seg-group{display:none}
.seg-group.on{display:block}
.rings{display:flex;gap:14px;justify-content:space-around;margin:2px 0 14px}
.ring{--p:0;position:relative;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--ring-c,var(--primary)) calc(var(--p) * 1%),var(--surface2) 0);display:flex;align-items:center;justify-content:center}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--bg)}
.ring span{position:relative;z-index:1;text-align:center;font-size:10px;color:var(--muted);line-height:1.25}
.ring b{display:block;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums}
.table{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 14px}
.table th{text-align:left;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--border);font-size:11px}
.table td{padding:9px 4px;border-bottom:1px solid var(--border);color:var(--text)}
.table td.num{text-align:right;font-variant-numeric:tabular-nums}
.mapcard{position:relative;height:150px;border-radius:var(--r-card);overflow:hidden;margin:0 0 14px;background:linear-gradient(135deg,var(--c1),var(--c2))}
.mapgrid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.16) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.16) 1px,transparent 1px);background-size:26px 26px}
.maproute{position:absolute;left:14%;top:66%;width:56%;height:2px;background:var(--primary);transform:rotate(-18deg);border-radius:2px;opacity:.9}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.pin i{width:14px;height:14px;border-radius:50%;background:var(--primary);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.mapbadge{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.45);color:#fff;font-size:11px;padding:4px 8px;border-radius:999px;backdrop-filter:blur(6px)}
.wave{display:flex;align-items:flex-end;gap:2px;height:64px;margin:0 0 6px}
.wave i{flex:1;background:var(--surface2);border-radius:2px}
.wave i.on{background:var(--primary)}
.wave-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:14px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:0 0 8px}
.stack span{display:block}
.stack-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-bottom:14px}
.stack-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.ctx{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:80}
.ctx.on{display:flex}
.ctx-panel{width:100%;background:var(--surface);border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.ctx-panel b{font-size:12px;color:var(--muted);font-weight:600;padding:0 4px 2px}
.ctx-panel button{border:0;background:var(--surface2);color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:13px;border-radius:12px;min-height:44px;cursor:pointer}
.ctx-panel button[data-ctx="cancel"]{background:transparent;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:36px 16px;text-align:center}
.empty-ic{width:52px;height:52px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.empty b{font-size:15px;line-height:1.4}
.empty p{font-size:13px;color:var(--muted);line-height:1.5;max-width:260px}
.empty .hero-btn{margin-top:6px}
.timeline{list-style:none;margin:0 0 14px;padding:0 0 0 18px;position:relative}
.timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border)}
.timeline li{position:relative;padding:0 0 14px}
.timeline li i{position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--bg)}
.timeline b{display:block;font-size:13px}
.timeline span{display:block;font-size:11px;color:var(--muted);margin:2px 0 4px}
.timeline p{font-size:12px;color:var(--muted);line-height:1.5}
.slider{margin:0 0 14px}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.slider-head label{font-size:13px;font-weight:600}
.slider-head output{font-size:13px;color:var(--primary);font-variant-numeric:tabular-nums}
.slider input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
.slider input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--surface2)}
.slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--primary);border:2px solid var(--bg)}
.chip.on{background:var(--text);color:var(--bg)}
.chart{margin:12px 16px 0;padding:14px;border-radius:var(--r-card);background:var(--surface)}
.chart-head{display:flex;justify-content:space-between;font:600 12px/1.2 var(--font);color:var(--muted);margin-bottom:10px}
.bars{display:flex;align-items:flex-end;gap:6px;height:116px}
.bars div{flex:1;display:grid;grid-template-rows:1fr auto;align-items:end;justify-items:center;gap:4px;height:100%}
.bars i{width:100%;border-radius:3px 3px 0 0;background:var(--surface2)}
.bars i.hot{background:var(--primary)}
.bars span{font:500 9px/1.2 var(--font);color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:2px 16px}
.tool{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-ctl);background:var(--surface);text-align:left}
.tool i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary-text);font-style:normal;font:700 11px/1 var(--font);flex:none}
.tool div{min-width:0}
.tool b{display:block;font:600 13px/1.3 var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool span{display:block;font:400 10px/1.3 var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tasks{display:grid;padding:0 16px}
.task{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--border);text-align:left;width:100%}
.check{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;margin-top:1px;flex:none;color:transparent}
.check.done{background:var(--ok);border-color:var(--ok);color:#fff}
.check .icon{width:11px;height:11px;stroke-width:3}
.task.done .row-main b{color:var(--muted);text-decoration:line-through}
.swipe{margin:4px 16px;position:relative}
.swipe .art{aspect-ratio:3/4;border-radius:18px;font-size:34px;justify-items:start;align-items:end;padding:18px;display:flex;flex-direction:column;justify-content:flex-end}
.swipe-name{font:800 26px/1.1 var(--font);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.4)}
.swipe-sub{font:500 13px/1.4 var(--font);color:rgba(255,255,255,.86);margin-top:3px}
.swipe-actions{display:flex;justify-content:center;gap:14px;margin-top:14px}
.swipe-actions button{width:52px;height:52px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--text)}
.swipe-actions .pass{color:var(--danger)}
.swipe-actions .like{background:var(--primary);color:var(--on-primary)}
.profile{display:flex;align-items:center;gap:12px;padding:6px 16px 12px}
.profile .avatar{width:62px;height:62px;font-size:20px}
.profile b{display:block;font:700 23px/1.2 var(--font)}
.profile span{font:400 12px/1.4 var(--font);color:var(--muted)}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 16px 12px;padding:12px;border-radius:var(--r-card);background:var(--surface);text-align:center}
.profile-stats b{display:block;font:800 19px/1.1 var(--font);font-variant-numeric:tabular-nums}
.profile-stats span{font:400 10px/1.3 var(--font);color:var(--muted)}
.settings{display:grid;margin:0 16px;border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.setting{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);text-align:left}
.setting:last-child{border-bottom:0}
.setting-main{flex:1;min-width:0}
.setting-main b{display:block;font:600 14px/1.35 var(--font)}
.setting-main span{display:block;font:400 11px/1.4 var(--font);color:var(--muted);margin-top:2px}
.switch{width:44px;height:26px;border-radius:99px;background:var(--surface2);position:relative;flex:none;transition:background .18s}
.switch::before{content:"";position:absolute;inset:-9px 0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .18s}
.switch.on{background:var(--primary)}
.switch.on::after{transform:translateX(18px)}
.note{margin:16px;padding:12px 14px;border-radius:var(--r-ctl);background:var(--surface);font:400 11px/1.6 var(--font);color:var(--muted);text-align:center}
.bubbles{display:flex;flex-direction:column;gap:8px;padding:4px 0 10px}
.bubble{max-width:82%;padding:9px 12px;border-radius:14px;background:var(--surface);font:400 14px/1.45 var(--font);color:var(--text)}
.bubble.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;border-bottom-left-radius:4px}
.bubble time{display:block;margin-top:2px;font:400 9px/1.3 var(--font);opacity:.65}
.composer{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--border)}
.composer input{flex:1;min-width:0;height:40px;padding:0 12px;border-radius:var(--r-ctl);background:var(--surface);color:var(--text);font:400 14px/1.3 var(--font)}
.composer button{height:40px;padding:0 14px;border-radius:var(--r-pill);background:var(--primary);color:var(--on-primary);font:700 12px/1 var(--font);flex:none}
.prompt{display:flex;gap:8px;margin:12px 16px 0;padding:8px;border:1px solid var(--border);border-radius:calc(var(--r-card) + 4px);background:var(--surface)}
.prompt input{flex:1;min-width:0;height:38px;padding:0 10px;font:400 13px/1.3 var(--font);color:var(--text)}
.prompt button{padding:0 14px;border-radius:var(--r-ctl);background:var(--primary);color:var(--on-primary);font:700 12px/1 var(--font);flex:none}
.sheet{position:absolute;inset:0;z-index:60;display:flex;align-items:flex-end;background:rgba(0,0,0,.48);opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s}
.sheet.on{opacity:1;visibility:visible}
.sheet-panel{width:100%;max-height:84%;display:flex;flex-direction:column;background:var(--bg);border-radius:18px 18px 0 0;box-shadow:var(--shadow);transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
.sheet.on .sheet-panel{transform:none}
.grab{width:36px;height:4px;border-radius:99px;background:var(--border);margin:8px auto 2px;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;flex:none}
.sheet-head b{font:700 18px/1.3 var(--font)}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:0 16px 24px}
.searchview{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg);opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s}
.searchview.on{opacity:1;visibility:visible}
.searchbar{display:flex;align-items:center;gap:8px;margin:46px 16px 10px;padding:0 12px;height:42px;border-radius:var(--r-ctl);background:var(--surface);color:var(--muted);flex:none}
.searchbar input{flex:1;min-width:0;color:var(--text);font:400 14px/1.3 var(--font)}
.search-results{flex:1;overflow-y:auto}
.live{position:absolute;inset:0;z-index:70;display:none;flex-direction:column;color:#fff;padding:50px 22px 26px}
.live.on{display:flex}
.live-bg{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));opacity:.92}
.live-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.75))}
.live-head,.live-main,.live-actions{position:relative;z-index:1}
.live-head{display:flex;justify-content:space-between;align-items:center;font:700 10px/1 var(--font);letter-spacing:1.2px}
.live-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.live-art{width:190px;height:190px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;font:800 42px/1 var(--font);margin-bottom:22px}
.live-main h2{font:700 22px/1.2 var(--font)}
.live-main p{font:400 13px/1.4 var(--font);opacity:.8;margin-top:4px}
.live-time{font:900 46px/1 var(--font);font-variant-numeric:tabular-nums;margin:18px 0 0}
.live-progress{width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.25);margin-top:18px;overflow:hidden}
.live-progress i{display:block;height:100%;width:0;background:#fff;border-radius:99px}
.live-actions{display:flex;justify-content:center;gap:18px;padding-top:22px}
.live-actions button{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.live-actions .main{background:#fff;color:#111;width:66px;height:66px}
.live-actions .icon{width:24px;height:24px;fill:currentColor;stroke:none}
.toast{position:absolute;left:50%;bottom:92px;z-index:90;max-width:calc(100% - 40px);padding:9px 14px;border-radius:var(--r-ctl);background:var(--text);color:var(--bg);font:600 12px/1.4 var(--font);text-align:center;opacity:0;transform:translate(-50%,8px);transition:opacity .18s,transform .18s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:430px){.app{width:100vw;height:100dvh}}
@media(min-width:431px){body{padding:24px}.app{border-radius:32px;box-shadow:0 40px 90px rgba(0,0,0,.6)}}

 km","art":{"label":"林","c1":"#E8FF63","c2":"#D4EB4F"},"cta":{"label":"喜欢","live":false}},{"type":"stats","items":[["匹配","92%"],["距离","3 km"],["共同","5"]]},{"type":"note","text":"左右滑动或点击按钮；喜欢/跳过会即时反馈。"}]},"p2":{"title":"周野","blocks":[{"type":"hero","kicker":"PROFILE","title":"周野","sub":"29 · 建筑师 · 5 km","art":{"label":"周","c1":"#D4EB4F","c2":"#66E0A3"},"cta":{"label":"喜欢","live":false}},{"type":"stats","items":[["匹配","92%"],["距离","3 km"],["共同","5"]]},{"type":"note","text":"左右滑动或点击按钮；喜欢/跳过会即时反馈。"}]},"p3":{"title":"苏禾","blocks":[{"type":"hero","kicker":"PROFILE","title":"苏禾","sub":"26 · 摄影师 · 2 km","art":{"label":"苏","c1":"#E8FF63","c2":"#E8FF63"},"cta":{"label":"喜欢","live":false}},{"type":"stats","items":[["匹配","92%"],["距离","3 km"],["共同","5"]]},{"type":"note","text":"左右滑动或点击按钮；喜欢/跳过会即时反馈。"}]}},"live":null,"search":[{"id":"p1","title":"林夏","sub":"27 · 产品设计师 · 3 km"},{"id":"p2","title":"周野","sub":"29 · 建筑师 · 5 km"},{"id":"p3","title":"苏禾","sub":"26 · 摄影师 · 2 km"}],"longPress":false,"haptic":true,"themeAlt":false};
const state={tab:0,likes:new Set(),sheetId:null,query:'',liveOpen:false,playing:false,elapsed:0,timer:null};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let toastTimer;
const haptic=(ms)=>{if(!APP.haptic)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch{}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),1700)}
function artHTML(a,cls='art'){return `<span class="${cls}" style="--c1:${a.c1};--c2:${a.c2}"><span>${esc(a.label)}</span></span>`}
function hero(b){return `<section class="hero" style="--c1:${b.art.c1};--c2:${b.art.c2}"><div class="hero-art">${esc(b.art.label)}</div><div class="hero-copy"><small>${esc(b.kicker||'')}</small><b>${esc(b.title)}</b><p>${esc(b.sub||'')}</p></div>${b.cta?`<button class="hero-btn" ${b.cta.live?'data-live':'data-toast="'+esc(b.cta.label)+'"'}>${esc(b.cta.label)}</button>`:''}</section>`}
function stats(b){return `<div class="stats cols3">${b.items.map(([k,v])=>`<div><small>${esc(k)}</small><b>${esc(v)}</b></div>`).join('')}</div>`}
function rail(b){return `${b.title?`<div class="section"><div class="section-head"><b>${esc(b.title)}</b><span>${b.items.length} 项</span></div></div>`:''}<div class="rail">${b.items.map(x=>`<button class="tile" data-open="${esc(x.id)}">${artHTML(x.art)}<b>${esc(x.title)}</b><small>${esc(x.sub||'')}</small></button>`).join('')}</div>`}
function posters(b){return `${b.title?`<div class="section"><div class="section-head"><b>${esc(b.title)}</b><span>${b.items.length} 部</span></div></div>`:''}<div class="posters">${b.items.map(x=>`<button class="poster" data-open="${esc(x.id)}">${artHTML(x.art)}<b>${esc(x.title)}</b><small>${esc(x.sub||'')}</small></button>`).join('')}</div>`}
function list(b){if(!b.rows||!b.rows.length)return empty({icon:'search',title:'暂无内容',sub:'这里还没有可展示的条目。'});return `${b.title?`<div class="section"><div class="section-head"><b>${esc(b.title)}</b><span>${b.rows.length} 条</span></div></div>`:''}<div class="list">${b.rows.map(x=>`<button class="row" data-open="${esc(x.id)}">${x.art?artHTML(x.art):'<span class="art" style="--c1:var(--surface2);--c2:var(--surface)"></span>'}<span class="row-main"><b>${esc(x.title)}</b><span>${esc(x.sub||'')}</span></span><span class="row-meta">${esc(x.meta||'')}</span></button>`).join('')}</div>`}
function empty(b){return `<div class="empty"><span class="empty-ic"><svg class="icon"><use href="#i-${b.icon||'search'}"/></svg></span><b>${esc(b.title||'暂无内容')}</b>${b.sub?`<p>${esc(b.sub)}</p>`:''}${b.cta?`<button class="hero-btn" data-toast="${esc(b.cta)}">${esc(b.cta)}</button>`:''}</div>`}
function waveform(b){const max=Math.max(...b.values,1);return `<div class="wave">${b.values.map((v,i)=>`<i class="${b.active&&i<=b.active?'on':''}" style="height:${Math.max(8,(v/max)*100)}%"></i>`).join('')}</div>${b.meta?`<div class="wave-meta"><span>${esc(b.meta.left||'')}</span><span>${esc(b.meta.right||'')}</span></div>`:''}`}
function stacked(b){return `<div class="stack">${b.items.map(x=>`<span style="flex:${x.value};background:${x.color||'var(--primary)'}"></span>`).join('')}</div><div class="stack-legend">${b.items.map(x=>`<span><i style="background:${x.color||'var(--primary)'}"></i>${esc(x.label)} ${x.value}%</span>`).join('')}</div>`}
function mapblock(b){return `<div class="mapcard" style="--c1:${b.art.c1};--c2:${b.art.c2}"><span class="mapgrid"></span><span class="maproute"></span><span class="pin" style="left:${b.pin.x}%;top:${b.pin.y}%"><i></i>${esc(b.label||'')}</span>${b.meta?`<span class="mapbadge">${esc(b.meta)}</span>`:''}</div>`}
function timeline(b){return `<ol class="timeline">${b.items.map(x=>`<li><i></i><div><b>${esc(x.title)}</b><span>${esc(x.time||'')}</span><p>${esc(x.text||'')}</p></div></li>`).join('')}</ol>`}
function slider(b){const id=`sl-${b.key}`;return `<div class="slider"><div class="slider-head"><label for="${id}">${esc(b.label)}</label><output data-slider-out>${esc(b.unit||'')}${esc(b.value)}</output></div><input id="${id}" type="range" min="${b.min ?? 0}" max="${b.max ?? 100}" value="${b.value}" data-slider data-slider-unit="${esc(b.unit || '')}"></div>`}
function rings(b){return `<div class="rings">${b.items.map(x=>`<div class="ring" style="--p:${Math.max(0,Math.min(100,x.value))};--ring-c:${x.color||'var(--primary)'}"><span><b>${esc(x.value)}%</b><small>${esc(x.label)}</small></span></div>`).join('')}</div>`}
function table(b){return `<table class="table"><thead><tr>${b.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===r.length-1?' class="num"':''}>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function segmented(b){return `<div class="segwrap"><div class="seg" role="tablist">${b.items.map((x,i)=>`<button class="seg-btn ${i===0?'on':''}" data-seg="${i}" role="tab" aria-selected="${i===0}">${esc(x)}</button>`).join('')}</div>${b.groups.map((rows,i)=>`<div class="seg-group ${i===0?'on':''}">${list({rows})}</div>`).join('')}</div>`}
function chips(b){return `<div class="chips">${b.items.map((x,i)=>`<button class="chip ${i===0?'on':''}" data-chip>${esc(x)}</button>`).join('')}</div>`}
function chart(b){const max=Math.max(...b.values,1);return `<div class="chart"><div class="chart-head"><span>${esc(b.title)}</span><span>${esc(b.unit||'')}</span></div><div class="bars">${b.values.map((v,i)=>`<div><i class="${i===b.values.length-1?'hot':''}" style="height:${Math.max(6,v/max*100)}%"></i><span>${esc(b.labels[i]||'')}</span></div>`).join('')}</div></div>`}
function tools(b){return `${b.title?`<div class="section"><div class="section-head"><b>${esc(b.title)}</b><span>${b.items.length} 个</span></div></div>`:''}<div class="tools">${b.items.map(([label,sub,tag],i)=>`<button class="tool" data-chip><i>${esc(tag||label.slice(0,2))}</i><div><b>${esc(label)}</b><span>${esc(sub)}</span></div></button>`).join('')}</div>`}
function tasks(b){return `${b.title?`<div class="section"><div class="section-head"><b>${esc(b.title)}</b><span>${b.rows.filter(x=>x.done).length}/${b.rows.length}</span></div></div>`:''}<div class="tasks">${b.rows.map(x=>`<button class="task ${x.done?'done':''}" data-task="${esc(x.id)}"><span class="check ${x.done?'done':''}"><svg class="icon"><use href="#i-check"/></svg></span><span class="row-main"><b>${esc(x.title)}</b><span>${esc(x.sub||'')}</span></span></button>`).join('')}</div>`}
function swipe(b){return `<div class="swipe"><div class="art" style="--c1:${b.item.art.c1};--c2:${b.item.art.c2}"><span class="swipe-name">${esc(b.item.name)}</span><span class="swipe-sub">${esc(b.item.sub)}</span></div><div class="swipe-actions"><button class="pass" data-act="pass" aria-label="跳过"><svg class="icon"><use href="#i-close"/></svg></button><button class="like" data-act="like" data-id="${esc(b.item.id)}" aria-label="喜欢"><svg class="icon"><use href="#i-heart"/></svg></button></div></div>`}
function profile(b){return `<div class="profile"><span class="avatar" style="--hue:var(--primary)">${esc(b.art.label)}</span><div><b>${esc(b.name)}</b><span>${esc(b.sub)}</span></div></div><div class="profile-stats">${b.stats.map(([k,v])=>`<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join('')}</div>`}
function settings(b){return `<div class="settings">${b.rows.map(([t,s,on])=>`<div class="setting"><div class="setting-main"><b>${esc(t)}</b><span>${esc(s)}</span></div><button class="switch ${on?'on':''}" data-switch aria-label="${esc(t)}"></button></div>`).join('')}</div>`}
function note(b){return `<p class="note">${esc(b.text)}</p>`}
function bubbles(b){const msgs=b.messages||[];return `<div class="bubbles">${msgs.map(m=>`<div class="bubble ${m[0]}">${esc(m[1])}<time>${esc(m[2]||'')}</time></div>`).join('')}</div>`}
function composer(b){return `<form class="composer" data-composer><input placeholder="${esc(b.placeholder||'发消息…')}" autocomplete="off"><button type="submit">发送</button></form>`}
function promptBlock(b){return `<form class="prompt" data-prompt><input placeholder="${esc(b.placeholder||'描述你的任务…')}" autocomplete="off"><button type="submit">${esc(b.button||'发送')}</button></form>`}
function block(b){switch(b.type){case'hero':return hero(b);case'stats':return stats(b);case'rail':return rail(b);case'posters':return posters(b);case'list':return list(b);case'chips':return chips(b);case'segmented':return segmented(b);case'rings':return rings(b);case'timeline':return timeline(b);case'map':return mapblock(b);case'waveform':return waveform(b);case'empty':return empty(b);case'stacked':return stacked(b);case'slider':return slider(b);case'table':return table(b);case'chart':return chart(b);case'tools':return tools(b);case'tasks':return tasks(b);case'swipe':return swipe(b);case'profile':return profile(b);case'settings':return settings(b);case'note':return note(b);case'bubbles':return bubbles(b);case'composer':return composer(b);case'prompt':return promptBlock(b);default:return ''}}
function current(){return APP.tabs[state.tab]}
function render(){const t=current();$('#title').textContent=t.label;$('#sub').textContent=`${APP.app} · ${APP.domain==='tools'?'工具':APP.domain==='music'?'音乐':APP.domain==='fitness'?'运动':APP.domain==='finance'?'金融':APP.domain==='messaging'?'消息':APP.domain==='video'?'视频':APP.domain==='food'?'餐饮':APP.domain==='travel'?'旅行':APP.domain==='dating'?'约会':APP.domain==='productivity'?'效率':'社交'}样板间`;$('#avatar').textContent=APP.app.slice(0,1);$('#content').innerHTML=`<section class="view on" id="v-${t.id}">${(APP.screens[t.id]||[]).map(block).join('')}</section>`;$('#tabbar').style.gridTemplateColumns=`repeat(${APP.tabs.length},1fr)`;$('#tabbar').innerHTML=APP.tabs.map((x,i)=>`<button class="tab ${i===state.tab?'on':''}" data-tab="${i}" role="tab" aria-selected="${i===state.tab}"><svg class="icon"><use href="#i-${x.icon}"/></svg><span>${esc(x.label)}</span></button>`).join('')+`<span class="homebar"></span>`}
function openSheet(id){const d=APP.details[id];if(!d)return;closeSearch();state.sheetId=id;$('#sheetTitle').textContent=d.title;$('#sheetBody').innerHTML=d.blocks.map(block).join('');$('#sheet').classList.add('on');$('#sheetBody').scrollTop=0}
function closeSheet(){$('#sheet').classList.remove('on')}
function openSearch(){state.query='';$('#searchInput').value='';renderSearch('');$('#searchview').classList.add('on');setTimeout(()=>$('#searchInput').focus(),60)}
function closeSearch(){$('#searchview').classList.remove('on')}
function renderSearch(q){const key=q.trim().toLowerCase();const rows=(APP.search||[]).filter(x=>!key||(x.title+' '+x.sub).toLowerCase().includes(key));$('#searchResults').innerHTML=rows.length?`<div class="list">${rows.map(x=>`<button class="row" data-open="${esc(x.id)}"><span class="row-main"><b>${esc(x.title)}</b><span>${esc(x.sub||'')}</span></span><span class="row-meta">→</span></button>`).join('')}</div>`:empty({icon:'search',title:`没有找到「${q}」`,sub:'换个关键词，或从下面的热门内容开始。',cta:'清空筛选'})}
function openLive(){const l=APP.live;if(!l){toast('此样板间暂无播放/记录流程');return}state.liveOpen=true;state.elapsed=0;state.playing=true;$('#liveBg').style=`--c1:${l.art.c1};--c2:${l.art.c2}`;$('#liveArt').textContent=l.art.label;$('#liveTitle').textContent=l.title;$('#liveSub').textContent=l.sub;$('#liveKicker').textContent=l.kind==='music'?'NOW PLAYING':l.kind==='fitness'?'RECORDING':'PLAYING';$('#live').classList.add('on');updateLive();clearInterval(state.timer);state.timer=setInterval(()=>{if(state.liveOpen&&state.playing){state.elapsed+=1;updateLive()}},1000)}
function updateLive(){const l=APP.live;const dur=l.duration||1;const sec=state.elapsed;$('#liveTime').textContent=l.kind==='fitness'?`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`:l.kind==='music'?`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`:'';$('#liveFill').style.width=Math.min(100,sec/(l.kind==='fitness'?60:dur)*100)+'%';$('#livePlay').innerHTML=`<svg class="icon"><use href="#i-${state.playing?'pause':'play'}"/></svg>`}
function closeLive(){state.liveOpen=false;state.playing=false;clearInterval(state.timer);$('#live').classList.remove('on')}
document.addEventListener('input',e=>{const r=e.target.closest('[data-slider]');if(!r)return;const out=r.parentElement.querySelector('[data-slider-out]');if(out)out.textContent=(r.dataset.sliderUnit||'')+r.value})
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]');if(tab){haptic(8);state.tab=Number(tab.dataset.tab);render();return}
  if(lpFired&&e.target.closest('[data-open]')){lpFired=false;return}
  const open=e.target.closest('[data-open]');if(open&&!e.target.closest('.sheet')){openSheet(open.dataset.open);return}
  const live=e.target.closest('[data-live]');if(live){openLive();return}
  const hint=e.target.closest('[data-toast]');if(hint){toast(hint.dataset.toast+' · 演示入口');return}
  const task=e.target.closest('[data-task]');if(task){const id=task.dataset.task;for(const s of Object.values(APP.screens))for(const b of s)if(b.type==='tasks')for(const r of b.rows)if(r.id===id)r.done=!r.done;for(const d of Object.values(APP.details))for(const b of d.blocks)if(b.type==='tasks')for(const r of b.rows)if(r.id===id)r.done=!r.done;render();if(state.sheetId)openSheet(state.sheetId);toast('任务状态已更新');return}
  const cx=e.target.closest('[data-ctx]');if(cx){$('#ctx').classList.remove('on');if(cx.dataset.ctx!=='cancel')toast(cx.dataset.ctx==='save'?'已收藏':'已分享');return}
  const seg=e.target.closest('[data-seg]');if(seg){const wrap=seg.closest('.segwrap');const i=Number(seg.dataset.seg);wrap.querySelectorAll('.seg-btn').forEach((x,k)=>{x.classList.toggle('on',k===i);x.setAttribute('aria-selected',String(k===i))});wrap.querySelectorAll('.seg-group').forEach((x,k)=>x.classList.toggle('on',k===i));return}
  const chip=e.target.closest('[data-chip]');if(chip){haptic(6);$$('.chip').forEach(c=>c.classList.toggle('on',c===chip));return}
  const sw=e.target.closest('[data-switch]');if(sw){haptic(10);sw.classList.toggle('on');toast(sw.classList.contains('on')?'已开启':'已关闭');return}
  const act=e.target.closest('[data-act]');if(act){haptic(12);if(act.dataset.act==='like'){toast('已喜欢')}else{toast('已跳过')}return}
})
function openCtx(row){const t=row.querySelector('b');$('#ctxTitle').textContent=t?t.textContent:'操作';$('#ctx').classList.add('on')}
let lpTimer=null,lpFired=false
if(APP.longPress){
  document.addEventListener('touchstart',e=>{const row=e.target.closest('[data-open]');if(!row||e.touches.length!==1||state.liveOpen)return;lpFired=false;clearTimeout(lpTimer);lpTimer=setTimeout(()=>{lpFired=true;haptic(18);openCtx(row)},480)},{passive:true})
  document.addEventListener('touchmove',()=>clearTimeout(lpTimer),{passive:true})
  document.addEventListener('touchend',()=>clearTimeout(lpTimer),{passive:true})
  document.addEventListener('touchcancel',()=>clearTimeout(lpTimer),{passive:true})
}
$('#ctx').addEventListener('click',e=>{if(e.target===$('#ctx'))$('#ctx').classList.remove('on')})
$('#searchBtn').addEventListener('click',openSearch)
const themeBtn=$('#themeBtn');if(themeBtn)themeBtn.addEventListener('click',()=>{const r=document.documentElement;const alt=r.dataset.theme!=='alt';r.dataset.theme=alt?'alt':'';const u=themeBtn.querySelector('use');if(u)u.setAttribute('href',alt?'#i-moon':'#i-sun');haptic(8)})
$('#searchClose').addEventListener('click',closeSearch)
$('#searchInput').addEventListener('input',e=>renderSearch(e.target.value))
$('#sheetClose').addEventListener('click',closeSheet)
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))closeSheet()})
$('#liveClose').addEventListener('click',closeLive)
$('#livePlay').addEventListener('click',()=>{haptic(10);state.playing=!state.playing;updateLive();toast(state.playing?'继续':'已暂停')})
$('#liveMain').addEventListener('click',()=>{closeLive();toast(APP.live?.kind==='fitness'?'记录已保存':'已结束播放')})
function submitHandler(e){const form=e.target.closest('[data-composer]');if(form){e.preventDefault();const input=$('input',form);const v=input.value.trim();if(!v)return;const d=APP.details[state.sheetId];if(d){const b=d.blocks.find(x=>x.type==='bubbles');if(b){(b.messages||(b.messages=[])).push(['me',v,'刚刚']);}openSheet(state.sheetId);toast('已发送')}return}const pr=e.target.closest('[data-prompt]');if(pr){e.preventDefault();const v=$('input',pr).value.trim();if(v){toast('已提交：'+v);$('input',pr).value=''}}}
$('#content').addEventListener('submit',submitHandler)
$('#sheetBody').addEventListener('submit',submitHandler)
// 下拉刷新（规范 68 份声明 pull-to-refresh）
const ptrEl=document.createElement('div');ptrEl.className='ptr';ptrEl.setAttribute('aria-hidden','true');ptrEl.innerHTML='<span></span>';document.body.appendChild(ptrEl)
let ptrOn=false,ptrY=0,ptrReady=false
const ptrView=$('#content')
ptrView.addEventListener('touchstart',e=>{if(ptrView.scrollTop>0||e.touches.length!==1||state.liveOpen)return;ptrOn=true;ptrY=e.touches[0].clientY;ptrReady=false},{passive:true})
ptrView.addEventListener('touchmove',e=>{if(!ptrOn)return;const dy=e.touches[0].clientY-ptrY;if(dy<=0)return;ptrReady=dy*.5>=44;ptrEl.classList.toggle('on',ptrReady)},{passive:true})
ptrView.addEventListener('touchend',()=>{if(!ptrOn)return;ptrOn=false;if(!ptrReady){ptrEl.classList.remove('on');return}setTimeout(()=>{ptrEl.classList.remove('on');render();toast('已刷新')},480)})
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();closeSearch();$('#ctx').classList.remove('on');if(state.liveOpen)closeLive()}})
render()
</script>
</body>
</html>
